[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "cli-market-integrations"
version = "0.1.0"
description = "CRM adapters for CLI Market price intelligence (Simla, HubSpot, Zoho)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "CLI Market", email = "hola@cli-market.dev" }]
keywords = ["crm", "price-intelligence", "simla", "hubspot", "zoho", "cli-market"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "httpx>=0.27,<1",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
serve = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    "pydantic>=2,<3",
]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
]
all = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    "pydantic>=2,<3",
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
]

[project.scripts]
cli-market-integrate = "cli_market_integrations.cli:main"

[tool.setuptools.packages.find]
where = [".."]
include = ["cli_market_integrations*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
