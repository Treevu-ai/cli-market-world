# Weekly circuit-open probe (COL-5). Does not disable the global CB.
name: Collector circuit probe

on:
  schedule:
    - cron: "0 14 * * 1" # Monday 09:00 PET
  workflow_dispatch:
    inputs:
      probe_collect:
        description: "Also run collect_prices --catalog-store for each circuit_open store"
        required: false
        default: "false"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -q httpx
      - name: Probe circuit_open stores
        env:
          MARKET_API_URL: https://cli-market-api.fly.dev
          MARKET_API_TOKEN: ${{ secrets.MARKET_API_TOKEN }}
        run: |
          FLAGS="--json"
          python3 ops/collector_circuit_probe.py $FLAGS | tee /tmp/circuit-probe.json
