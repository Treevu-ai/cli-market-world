name: DEBUG basket_stress fallback (temp)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -q psycopg2-binary
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Open WireGuard tunnel to cli-market-db
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_DB_PROXY_TOKEN }}
        run: |
          flyctl proxy 5432:5432 -a cli-market-db &
          up=""
          for i in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/5432) 2>/dev/null && { up=1; echo "tunnel up"; break; }
            sleep 1
          done
          [ -n "$up" ] || { echo "::error::tunnel never came up"; exit 1; }

      - name: Inspect name column in old price_history rows
        env:
          DATABASE_URL_INTERNAL: ${{ secrets.DATABASE_URL }}
          PG_SSL_MODE: disable
        run: |
          export DATABASE_URL=$(echo "$DATABASE_URL_INTERNAL" | sed -E 's#@[^/]+/#@localhost:5432/#')
          python3 - <<'PYEOF'
          import os, psycopg2, psycopg2.extras
          conn = psycopg2.connect(os.environ["DATABASE_URL"], sslmode="disable", connect_timeout=10)
          cur = conn.cursor(cursor_factory=psycopg2.extras.RealDictCursor)

          cur.execute("""
              SELECT COUNT(*) AS n, SUM(CASE WHEN name IS NULL THEN 1 ELSE 0 END) AS null_name,
                     SUM(CASE WHEN name = '' THEN 1 ELSE 0 END) AS empty_name
              FROM price_history WHERE recorded_at <= now() - interval '30 days'
          """)
          print("=== name column stats for old rows ===")
          print(dict(cur.fetchone()))
          print()

          cur.execute("""
              SELECT store, name, price, recorded_at
              FROM price_history
              WHERE recorded_at <= now() - interval '30 days' AND store = 'plazavea'
              ORDER BY recorded_at DESC LIMIT 10
          """)
          print("=== sample plazavea old rows (any name) ===")
          for r in cur.fetchall():
              print(dict(r))
          print()

          cur.execute("""
              SELECT column_name, data_type FROM information_schema.columns
              WHERE table_name = 'price_history' ORDER BY ordinal_position
          """)
          print("=== price_history columns ===")
          for r in cur.fetchall():
              print(dict(r))
          conn.close()
          PYEOF
