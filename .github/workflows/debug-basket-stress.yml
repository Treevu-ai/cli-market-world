name: DEBUG basket_stress fallback (temp)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -q psycopg2-binary
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Open WireGuard tunnel to cli-market-db
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_DB_PROXY_TOKEN }}
        run: |
          flyctl proxy 5432:5432 -a cli-market-db &
          up=""
          for i in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/5432) 2>/dev/null && { up=1; echo "tunnel up"; break; }
            sleep 1
          done
          [ -n "$up" ] || { echo "::error::tunnel never came up"; exit 1; }

      - name: Inspect old price_history rows by store/country
        env:
          DATABASE_URL_INTERNAL: ${{ secrets.DATABASE_URL }}
          PG_SSL_MODE: disable
        run: |
          export DATABASE_URL=$(echo "$DATABASE_URL_INTERNAL" | sed -E 's#@[^/]+/#@localhost:5432/#')
          python3 - <<'PYEOF'
          import os, psycopg2, psycopg2.extras
          conn = psycopg2.connect(os.environ["DATABASE_URL"], sslmode="disable", connect_timeout=10)
          cur = conn.cursor(cursor_factory=psycopg2.extras.RealDictCursor)

          cur.execute("""
              SELECT store, COUNT(*) AS n
              FROM price_history
              WHERE recorded_at <= now() - interval '30 days'
              GROUP BY store ORDER BY n DESC LIMIT 30
          """)
          print("=== stores with >=30d-old price_history rows ===")
          for r in cur.fetchall():
              print(dict(r))
          print()

          # PE canasta stores
          import json
          cur.execute("""
              SELECT store, name, price, recorded_at
              FROM price_history
              WHERE recorded_at <= now() - interval '30 days'
                AND (name ILIKE '%leche%' OR name ILIKE '%arroz%' OR name ILIKE '%aceite%')
              ORDER BY recorded_at DESC LIMIT 15
          """)
          print("=== sample old canasta-name-matching rows (any country) ===")
          for r in cur.fetchall():
              print(dict(r))
          conn.close()
          PYEOF
