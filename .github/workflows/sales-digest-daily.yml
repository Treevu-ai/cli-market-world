name: Sales Digest Daily

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * *"  # 08:00 PET = 13:00 UTC
  push:
    branches: [main]
    paths:
      - "ops/sales_funnel_digest.py"
      - "ops/setup_slack_ventas.py"

jobs:
  sales-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Run sales digest
        env:
          MARKET_API_URL: ${{ vars.MARKET_API_URL }}
          MARKET_API_TOKEN: ${{ secrets.MARKET_API_TOKEN || vars.MARKET_API_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_VENTAS: ${{ vars.SLACK_CHANNEL_VENTAS || secrets.SLACK_CHANNEL_VENTAS }}
        run: |
          HOURS="${1:-24}"
          CODE=$(python3 ops/sales_funnel_digest.py --hours "$HOURS" --slack 2>&1 | tail -1 || true)
          echo "$CODE"
