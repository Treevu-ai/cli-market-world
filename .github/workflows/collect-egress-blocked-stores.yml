name: Collect egress-blocked stores (Smart Nutrition + Simply Natural Canada)

# smartnutrition_pe and simplynaturalcanada_ca WAF-block Fly.io's collector
# IP (verified live 2026-08-19) but respond 200 with real product data from
# a GitHub Actions runner's egress IP (verified live 2026-08-20, see
# CHANGELOG). No proxy needed -- just run the catalog pull from here instead
# and write straight to the same production Postgres the Fly.io collector
# uses. Scoped to exactly these two stores via --catalog-store; the Fly.io
# daemon keeps collecting everything else as usual.

on:
  schedule:
    - cron: "30 9 * * *" # 04:30 PET / 09:30 UTC — after the main daily-briefing cycle
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: collect-egress-blocked-stores
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/checkout@v6
        with:
          repository: Treevu-ai/cli-market-index
          ref: 4ed5f585ece892722cac1d06cb82f2d671635c5d
          path: .deps/cli-market-index
          token: ${{ secrets.GH_PAT }}

      - name: Install dependencies
        run: |
          grep -v '^cli-market-index' requirements.txt > /tmp/ci-requirements.txt
          pip install -q -r /tmp/ci-requirements.txt
          pip install -q -e ".deps/cli-market-index[postgres]"

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # cli-market-db only has a private Fly 6PN IP (no public IP -- confirmed
      # via `flyctl ips list -a cli-market-db`), so DATABASE_URL's
      # `cli-market-db.internal` host is unreachable from a GH Actions
      # runner directly. flyctl proxy opens an ephemeral WireGuard peer and
      # forwards localhost:5432 to it -- only that one port is tunneled,
      # this does NOT reroute the runner's normal internet egress (the
      # catalog-pull HTTP requests to the stores still go out the runner's
      # own IP, which is what makes this whole workaround work).
      - name: Open WireGuard tunnel to cli-market-db
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl proxy 5432:5432 -a cli-market-db &
          for i in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/5432) 2>/dev/null && { echo "tunnel up"; break; }
            sleep 1
          done

      - name: Force catalog pull for egress-blocked stores
        env:
          DATABASE_URL_INTERNAL: ${{ secrets.DATABASE_URL }}
          PG_SSL_MODE: disable
        run: |
          export DATABASE_URL=$(echo "$DATABASE_URL_INTERNAL" | sed -E 's#@[^/]+/#@localhost:5432/#')
          python3 collect_prices.py \
            --catalog-store smartnutrition_pe \
            --catalog-store simplynaturalcanada_ca
