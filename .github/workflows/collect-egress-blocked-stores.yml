name: Collect egress-blocked stores (Smart Nutrition + Simply Natural Canada)

# smartnutrition_pe and simplynaturalcanada_ca WAF-block Fly.io's collector
# IP (verified live 2026-08-19) but respond 200 with real product data from
# a GitHub Actions runner's egress IP (verified live 2026-08-20, see
# CHANGELOG). No proxy needed -- just run the catalog pull from here instead
# and write straight to the same production Postgres the Fly.io collector
# uses. Scoped to exactly these two stores via --catalog-store; the Fly.io
# daemon keeps collecting everything else as usual.

on:
  schedule:
    - cron: "30 9 * * *" # 04:30 PET / 09:30 UTC — after the main daily-briefing cycle
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: collect-egress-blocked-stores
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/checkout@v6
        with:
          repository: Treevu-ai/cli-market-index
          ref: 4ed5f585ece892722cac1d06cb82f2d671635c5d
          path: .deps/cli-market-index
          token: ${{ secrets.GH_PAT }}

      - name: Install dependencies
        run: |
          grep -v '^cli-market-index' requirements.txt > /tmp/ci-requirements.txt
          pip install -q -r /tmp/ci-requirements.txt
          pip install -q -e ".deps/cli-market-index[postgres]"

      - name: Force catalog pull for egress-blocked stores
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PG_SSL_MODE: ${{ secrets.PG_SSL_MODE || 'prefer' }}
        run: |
          python3 collect_prices.py \
            --catalog-store smartnutrition_pe \
            --catalog-store simplynaturalcanada_ca
