# Build cli-market-core from world patch → PyPI.
# Also syncs Treevu-ai/cli-market-core main + tag v{version} when GH_PAT has push.
#
# Manual: Actions → Publish cli-market-core (patch) → Run workflow
# T-173: default 1.9.35 (observatory_snapshot_streak); 1.9.36 = investigate mission.

name: Publish cli-market-core (patch)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Target core version (must match ops/patches/cli-market-core-{version}.patch)"
        required: false
        default: "1.11.0"

permissions:
  contents: read
  id-token: write

jobs:
  publish-core:
    uses: ./.github/workflows/_publish-core-reusable.yml
    # `environment: pypi` used to be declared here too, on the theory that a
    # caller job needs its own environment context to resolve
    # environment-scoped secrets before forwarding them via `secrets:` below.
    # That's not how it works for a job whose only content is `uses:` (a
    # reusable-workflow-call job) -- `environment:` isn't a valid key in that
    # schema variant at all (confirmed via `gh workflow run`: "Unexpected
    # value 'environment'"), and having it here made the entire workflow FILE
    # fail to parse, so every push to this repo showed a spurious red X for
    # this workflow regardless of content, found 2026-07-27. The reusable
    # workflow's own `publish-core` job (_publish-core-reusable.yml) already
    # declares `environment: pypi` on itself -- a REGULAR runs-on/steps job,
    # where the key is valid -- and that's what actually resolves the
    # environment-scoped secrets; the caller doesn't need its own copy.
    with:
      version: ${{ inputs.version }}
      pr_body: "Automated from cli-market-world publish-core-pypi workflow."
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
