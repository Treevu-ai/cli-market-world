name: DEBUG health-stats query (temp)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -q psycopg2-binary
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Open WireGuard tunnel to cli-market-db
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_DB_PROXY_TOKEN }}
        run: |
          flyctl proxy 5432:5432 -a cli-market-db &
          up=""
          for i in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/5432) 2>/dev/null && { up=1; echo "tunnel up"; break; }
            sleep 1
          done
          [ -n "$up" ] || { echo "::error::tunnel never came up"; exit 1; }

      - name: Inspect indexes + EXPLAIN the linkage query
        env:
          DATABASE_URL_INTERNAL: ${{ secrets.DATABASE_URL }}
          PG_SSL_MODE: disable
        run: |
          export DATABASE_URL=$(echo "$DATABASE_URL_INTERNAL" | sed -E 's#@[^/]+/#@localhost:5432/#')
          python3 - <<'PYEOF'
          import os, psycopg2, psycopg2.extras, time
          conn = psycopg2.connect(os.environ["DATABASE_URL"], sslmode="disable", connect_timeout=10)
          cur = conn.cursor(cursor_factory=psycopg2.extras.RealDictCursor)

          print("=== indexes on price_snapshots ===")
          cur.execute("SELECT indexname, indexdef FROM pg_indexes WHERE tablename = 'price_snapshots' ORDER BY indexname")
          for row in cur.fetchall():
              print(row["indexname"], "->", row["indexdef"])

          print()
          print("=== row count / distinct canonical_product_id ===")
          cur.execute("SELECT COUNT(*) AS n FROM price_snapshots WHERE price > 0")
          print("total price>0 rows:", cur.fetchone()["n"])

          print()
          print("=== EXPLAIN ANALYZE the actual compute_linkage_metrics query ===")
          t0 = time.monotonic()
          cur.execute("""
              EXPLAIN (ANALYZE, BUFFERS, FORMAT TEXT)
              SELECT
                COUNT(*) FILTER (WHERE canonical_product_id IS NOT NULL
                                   AND canonical_product_id != '') AS linked,
                COUNT(DISTINCT CASE
                  WHEN canonical_product_id IS NOT NULL AND canonical_product_id != ''
                  THEN canonical_product_id END) AS distinct_linked
              FROM price_snapshots WHERE price > 0
          """)
          for row in cur.fetchall():
              print(list(row.values())[0])
          print(f"wall clock: {time.monotonic()-t0:.2f}s")

          print()
          print("=== table size ===")
          cur.execute("SELECT pg_size_pretty(pg_total_relation_size('price_snapshots')) AS sz")
          print(cur.fetchone()["sz"])
          conn.close()
          PYEOF
