name: DEBUG basket_stress methodology (temp)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -q psycopg2-binary
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Open WireGuard tunnel to cli-market-db
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_DB_PROXY_TOKEN }}
        run: |
          flyctl proxy 5432:5432 -a cli-market-db &
          up=""
          for i in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/5432) 2>/dev/null && { up=1; echo "tunnel up"; break; }
            sleep 1
          done
          [ -n "$up" ] || { echo "::error::tunnel never came up"; exit 1; }

      - name: Check taxonomy registry cache and canonical_product_id coverage
        env:
          DATABASE_URL_INTERNAL: ${{ secrets.DATABASE_URL }}
          PG_SSL_MODE: disable
        run: |
          export DATABASE_URL=$(echo "$DATABASE_URL_INTERNAL" | sed -E 's#@[^/]+/#@localhost:5432/#')
          python3 - <<'PYEOF'
          import os, json, psycopg2, psycopg2.extras
          conn = psycopg2.connect(os.environ["DATABASE_URL"], sslmode="disable", connect_timeout=10)
          cur = conn.cursor(cursor_factory=psycopg2.extras.RealDictCursor)

          cur.execute("SELECT recorded_at, LENGTH(payload_json) AS n FROM enrichment_cache WHERE cache_key = 'taxonomy:registry'")
          row = cur.fetchone()
          print("=== taxonomy:registry cache row ===")
          print(dict(row) if row else None)

          if row:
              cur.execute("SELECT payload_json FROM enrichment_cache WHERE cache_key = 'taxonomy:registry'")
              payload = json.loads(cur.fetchone()["payload_json"])
              products = payload.get("products", {})
              print("registry_size field:", payload.get("registry_size"))
              print("products dict length:", len(products))
              # count canasta_item distribution
              from collections import Counter
              c = Counter(v.get("canasta_item") for v in products.values() if v.get("canasta_item"))
              print("canasta_item distribution:", dict(c))

          cur.execute("SELECT COUNT(*) AS n FROM price_snapshots WHERE canonical_product_id IS NOT NULL")
          print()
          print("price_snapshots rows with canonical_product_id:", cur.fetchone()["n"])
          cur.execute("SELECT COUNT(*) AS n FROM price_snapshots")
          print("price_snapshots total:", cur.fetchone()["n"])
          conn.close()
          PYEOF
