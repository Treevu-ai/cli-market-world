# Catalog gap classification 388 vs cycle (COL-6).
name: Collector catalog diff

on:
  schedule:
    - cron: "15 14 * * 1"
  workflow_dispatch:

jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -q httpx
      - name: Classify catalog vs last cycle
        env:
          MARKET_API_URL: https://cli-market-api.fly.dev
          MARKET_API_TOKEN: ${{ secrets.MARKET_API_TOKEN }}
        run: python3 ops/collector_catalog_diff.py --json | tee /tmp/catalog-diff.json
