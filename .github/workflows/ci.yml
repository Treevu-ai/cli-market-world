name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MARKET_DATA_DIR: /tmp/market-test-data
  DATABASE_URL: ""
  MARKET_SKIP_LIVE: "1"

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan tracked source for credentials
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Lint
        run: pip install ruff && ruff check .

      - name: Verify public copy (no stale 27-MCP / 61k references)
        run: python3 ops/verify_public_copy.py

      - name: Verify cli-market-index pin consistency
        run: pip install pyyaml && python3 ops/check_index_pin.py

  test:
    runs-on: ubuntu-latest
    needs: [lint, secret-scan]
    timeout-minutes: 10
    env:
      CI: "true"
      GITHUB_ACTIONS: "true"

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/checkout@v6
        with:
          repository: Treevu-ai/cli-market-index
          ref: a555dd7b9bc9afbfd9022950dc76c572def9193a
          path: .deps/cli-market-index
          token: ${{ secrets.GH_PAT }}

      - name: Probe GH_PAT backend read access
        id: probe-backend
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python ops/probe_gh_pat_backend.py

      - name: Checkout backend (required when GH_PAT has read)
        id: checkout-backend
        continue-on-error: ${{ steps.probe-backend.outputs.ok != 'true' }}
        uses: actions/checkout@v6
        with:
          repository: Treevu-ai/cli-market-backend
          ref: main
          path: .deps/cli-market-backend
          token: ${{ secrets.GH_PAT }}

      - name: Fail when backend checkout required but failed
        if: steps.probe-backend.outputs.ok == 'true' && steps.checkout-backend.outcome != 'success'
        run: |
          echo "::error::GH_PAT can read cli-market-backend but checkout failed — fix GH_PAT or repo access"
          exit 1

      - name: Install dependencies
        run: |
          # requirements.txt is the single source of truth, EXCEPT cli-market-index:
          # that line points pip at git+https, but we already have it checked out
          # locally (with GH_PAT auth via the checkout step above) — install that
          # local copy instead of making pip re-clone it over an unauthenticated URL.
          grep -v '^cli-market-index' requirements.txt > /tmp/ci-requirements.txt
          pip install -r /tmp/ci-requirements.txt
          pip install -e ".deps/cli-market-index[postgres]"
          pip install pytest
          python -c "from market_core.commerce_capabilities import get_commerce_capabilities; assert get_commerce_capabilities()['checkout']['scope'] == 'cli_market_internal'"

      - name: Contract parity (OpenAPI + core pin + Observatory mirror)
        if: steps.probe-backend.outputs.ok == 'true' && steps.checkout-backend.outcome == 'success'
        run: python ops/contract_parity.py --backend-path .deps/cli-market-backend

      - name: Contract parity skipped (GH_PAT cannot read backend)
        if: steps.probe-backend.outputs.ok != 'true'
        run: |
          echo "::warning::GH_PAT cannot read Treevu-ai/cli-market-backend — contract parity skipped. Add Contents: Read on backend repo to the fine-grained PAT in cli-market-world secrets."

      - name: Verify phase docs / required tests
        run: python ops/verify_phase_docs.py --audit-docs

      - name: Run tests
        run: pytest tests/test_checkout_payments.py tests/ -q -m "not integration"

  test-pg:
    runs-on: ubuntu-latest
    needs: [lint, secret-scan]
    timeout-minutes: 10
    env:
      CI: "true"
      GITHUB_ACTIONS: "true"
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
      MARKET_SKIP_LIVE: "1"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/checkout@v6
        with:
          repository: Treevu-ai/cli-market-index
          ref: a555dd7b9bc9afbfd9022950dc76c572def9193a
          path: .deps/cli-market-index
          token: ${{ secrets.GH_PAT }}

      - name: Probe GH_PAT backend read access
        id: probe-backend
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python ops/probe_gh_pat_backend.py

      - name: Checkout backend (required when GH_PAT has read)
        id: checkout-backend
        continue-on-error: ${{ steps.probe-backend.outputs.ok != 'true' }}
        uses: actions/checkout@v6
        with:
          repository: Treevu-ai/cli-market-backend
          ref: main
          path: .deps/cli-market-backend
          token: ${{ secrets.GH_PAT }}

      - name: Fail when backend checkout required but failed
        if: steps.probe-backend.outputs.ok == 'true' && steps.checkout-backend.outcome != 'success'
        run: |
          echo "::error::GH_PAT can read cli-market-backend but checkout failed — fix GH_PAT or repo access"
          exit 1

      - name: Install dependencies
        run: |
          # requirements.txt is the single source of truth, EXCEPT cli-market-index:
          # that line points pip at git+https, but we already have it checked out
          # locally (with GH_PAT auth via the checkout step above) — install that
          # local copy instead of making pip re-clone it over an unauthenticated URL.
          grep -v '^cli-market-index' requirements.txt > /tmp/ci-requirements.txt
          pip install -r /tmp/ci-requirements.txt
          pip install -e ".deps/cli-market-index[postgres]"
          pip install pytest
          python -c "from market_core.commerce_capabilities import get_commerce_capabilities; assert get_commerce_capabilities()['checkout']['scope'] == 'cli_market_internal'"

      - name: Contract parity (OpenAPI + core pin + Observatory mirror)
        if: steps.probe-backend.outputs.ok == 'true' && steps.checkout-backend.outcome == 'success'
        run: python ops/contract_parity.py --backend-path .deps/cli-market-backend

      - name: Contract parity skipped (GH_PAT cannot read backend)
        if: steps.probe-backend.outputs.ok != 'true'
        run: |
          echo "::warning::GH_PAT cannot read Treevu-ai/cli-market-backend — contract parity skipped. Add Contents: Read on backend repo to the fine-grained PAT in cli-market-world secrets."

      - name: Verify phase docs / required tests
        run: python ops/verify_phase_docs.py --audit-docs

      - name: Run tests against PostgreSQL
        run: pytest tests/test_checkout_payments.py tests/ -q -m "not integration"

  test-connectors:
    runs-on: ubuntu-latest
    needs: [lint, secret-scan]
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install connector dependencies
        run: |
          pip install "fastapi>=0.110,<1" "uvicorn[standard]>=0.27,<1" \
            "httpx>=0.27,<1" "python-dotenv>=1.0,<2" "pydantic>=2,<3" \
            "pytest>=8,<9" "pytest-asyncio>=0.23,<1"

      # cli_market_integrations is an installable package (has __init__.py
      # at the repo root), so it runs from the repo root like tests/.
      - name: Test cli_market_integrations (HubSpot/Zoho/Kommo/Simla adapters)
        run: pytest cli_market_integrations/tests/ -q

      # The three standalone prototypes import `from src.xxx import ...`
      # with no packaging/conftest to put `src` on sys.path — pytest must
      # run with cwd inside each prototype dir, same as running them locally.
      - name: Test hubspot-cli-market-prototype
        working-directory: hubspot-cli-market-prototype
        run: pytest tests/ -q

      - name: Test zoho-cli-market-prototype
        working-directory: zoho-cli-market-prototype
        run: pytest tests/ -q

      - name: Test simla-cli-market-prototype
        working-directory: simla-cli-market-prototype
        run: pytest tests/ -q

  smoke-production:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 8
    
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install smoke dependencies
        run: pip install httpx

      - name: Production smoke
        run: bash ops/smoke_e2e.sh

      - name: Doctor prod gate
        run: python3 ops/doctor_prod_gate.py

      - name: Collector health gate
        run: |
          python3 - <<'PY'
          import httpx
          r = httpx.get("https://cli-market-api.fly.dev/dashboard/data", timeout=45)
          r.raise_for_status()
          data = r.json()
          k = data.get("kpis", {})
          moat = data.get("moat_summary", {})
          pct = float(k.get("store_success_pct") or 0)
          healthy = int(k.get("healthy_stores") or 0)
          total = int(k.get("total_stores") or 1)
          indexed = int(k.get("total_indexed") or k.get("total_snapshots") or 0)
          critical = sum(
              1 for h in data.get("store_health", [])
              if float(h.get("success_pct") or 0) < 30
          )
          print(f"Store health: {healthy}/{total} ({pct}%) · indexados: {indexed:,} · críticas: {critical}")
          if moat.get("collector_stale"):
              raise SystemExit("collector_stale=true — moat data is stale")
          if indexed < 1000:
              raise SystemExit(f"total_indexed too low: {indexed}")
          PY
