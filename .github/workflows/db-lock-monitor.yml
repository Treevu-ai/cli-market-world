name: DB Lock & Collector Freshness Monitor

on:
  schedule:
    # Every 15 min — catches stuck idle-in-transaction sessions (like the
    # 2026-07-09 backfill incident) fast, before they block the collector
    # for an entire 8h cycle.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      max_idle_minutes:
        description: "Alert if a session is idle-in-transaction longer than N minutes"
        required: false
        default: "5"
      max_stale_hours:
        description: "Alert if the collector hasn't run in N hours"
        required: false
        # Collector cadence is COLLECT_INTERVAL_HOURS (fly.collector.toml) =
        # 8h -- was 4h when this default of 6 was set, which would now false-
        # alarm every single cycle since 8 > 6. ~1.5x the interval, same
        # margin the old 6-for-4h default gave.
        default: "12"

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -q httpx psycopg2-binary

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # cli-market-db has no public IP (private Fly 6PN only) -- this
      # script's DATABASE_URL secret has always pointed at the unreachable
      # `cli-market-db.internal` host, which is why every run of this
      # monitor has silently skipped its actual DB check since it was
      # created (see project_database_url_secret_missing memory). Tunnel
      # localhost:5432 to it the same way collect-egress-blocked-stores.yml
      # does.
      #
      # Uses FLY_DB_PROXY_TOKEN, NOT FLY_API_TOKEN -- confirmed live
      # 2026-08-20 that FLY_API_TOKEN is scoped to cli-market-api only
      # ("Could not find App cli-market-db"). FLY_DB_PROXY_TOKEN is a
      # separate token scoped to just this one app.
      - name: Open WireGuard tunnel to cli-market-db
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_DB_PROXY_TOKEN }}
        run: |
          flyctl proxy 5432:5432 -a cli-market-db &
          up=""
          for i in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/5432) 2>/dev/null && { up=1; echo "tunnel up"; break; }
            sleep 1
          done
          [ -n "$up" ] || { echo "::error::WireGuard tunnel to cli-market-db never came up"; exit 1; }

      - name: Run DB lock / collector freshness check
        env:
          DATABASE_URL_INTERNAL: ${{ secrets.DATABASE_URL }}
          PG_SSL_MODE: disable
          MARKET_API_URL: https://cli-market-api.fly.dev
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ALERTAS: ${{ secrets.SLACK_CHANNEL_ALERTAS || vars.SLACK_CHANNEL_ALERTAS }}
        run: |
          export DATABASE_URL=$(echo "$DATABASE_URL_INTERNAL" | sed -E 's#@[^/]+/#@localhost:5432/#')
          python3 ops/db_lock_monitor.py --slack \
            --max-idle-minutes "${{ github.event.inputs.max_idle_minutes || '5' }}" \
            --max-stale-hours "${{ github.event.inputs.max_stale_hours || '12' }}"
        # Exit code 1 = problem detected — mark as warning (Slack alert already
        # sent above), not a hard CI failure.
        continue-on-error: true
        id: monitor

      - name: Surface warning in Actions UI
        if: steps.monitor.outcome == 'failure'
        run: |
          echo "::warning::DB lock or collector staleness detected — check Slack #alertas for details"
