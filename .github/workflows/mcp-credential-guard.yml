name: MCP Credential Guard

on:
  schedule:
    # 08:15 PET (UTC-5), after the daily operational chain starts.
    - cron: "15 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect-raw-telemetry-credentials:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Run aggregate credential guard against production telemetry
        id: guard
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set +e
          flyctl ssh console --app cli-market-api --command "python ops/mcp_credential_guard.py --fail-on-detection"
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Alert bitácora on credential detection
        if: steps.guard.outputs.status == '1'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_BITACORA: "C0B6V3Y9ZSP"
        run: |
          python ops/slack_cli.py post --bitacora \
            "[SECURITY] MCP Credential Guard detectó valores tipo credencial en telemetría. Revisar este run y rotar/anonimizar antes de seguir operando."

      - name: Alert bitácora on guard failure
        if: steps.guard.outputs.status != '0' && steps.guard.outputs.status != '1'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_BITACORA: "C0B6V3Y9ZSP"
        run: |
          python ops/slack_cli.py post --bitacora \
            "[SECURITY] MCP Credential Guard no pudo completar la verificación. Revisar este run antes del siguiente ciclo operativo."

      - name: Fail workflow when the guard does not pass
        if: steps.guard.outputs.status != '0'
        run: |
          echo "::error::MCP Credential Guard did not pass. See the aggregate guard result above."
          exit 1
