name: MCP Credential Guard

on:
  schedule:
    # 08:15 PET (UTC-5), after the daily operational chain starts.
    - cron: "15 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect-raw-telemetry-credentials:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install guard dependencies
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config --global url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "https://github.com/"
          pip install --quiet --disable-pip-version-check -r requirements.txt

      - name: Run aggregate credential guard against production telemetry
        id: guard
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PG_SSL_MODE: ${{ secrets.PG_SSL_MODE || 'prefer' }}
        run: |
          python ops/mcp_credential_guard.py --fail-on-detection

      - name: Alert bitácora on detection
        if: steps.guard.outcome == 'failure'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_BITACORA: ${{ secrets.SLACK_CHANNEL_BITACORA || vars.SLACK_CHANNEL_BITACORA }}
        run: |
          python ops/slack_cli.py post --bitacora \
            "[SECURITY] MCP Credential Guard detectó valores tipo credencial en telemetría. Revisar este run y rotar/anonimizar antes de seguir operando."

      - name: Fail workflow when a credential-like value is detected
        if: steps.guard.outcome == 'failure'
        run: |
          echo "::error::MCP Credential Guard detected a raw credential-like telemetry value."
          exit 1
