name: Deploy API (no gate, temporary)

# TEMPORARY workflow — manual bypass for the ivano_pe removal release
# (1.12.62). CI's smoke-production job fails against the OLD deployed prod
# (still has ivano_pe, gate has zero tolerance for dead sources), so
# deploy-fly.yml never auto-triggers via workflow_run. This release's own
# post-deploy gate check will pass once it lands, since it removes
# ivano_pe. Delete this file after use.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy cli-market-api
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          BUILD_GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          flyctl deploy --app cli-market-api --config fly.toml \
            --build-secret github_token="$BUILD_GH_TOKEN" --remote-only \
            --wait-timeout 600

      - name: Post-deploy smoke test
        env:
          MARKET_API_URL: https://cli-market-api.fly.dev
        run: |
          pip install --quiet --disable-pip-version-check httpx
          bash ops/smoke_e2e.sh
          python3 ops/doctor_prod_gate.py
