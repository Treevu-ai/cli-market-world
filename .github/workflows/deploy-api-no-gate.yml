name: Deploy API (no gate, manual, temp)

# One-off: deploy-fly.yml's post-deploy smoke test includes
# ops/doctor_prod_gate.py, which has zero tolerance for dead stores
# (MAX_DEAD_SOURCES=0) and is currently blocked by ivano_pe (added
# 2026-08-27, exactly 1 collection attempt ever, no stored error text,
# site verified healthy via direct curl -- not related to the actual code
# in this deploy, which was independently verified working via the gate's
# own golden-linkage check twice already). Deploys straight, no smoke test,
# so the /health/stats timeout fix (already confirmed working) actually
# reaches production instead of bouncing on an unrelated store.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency: deploy-fly-api
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy cli-market-api
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          BUILD_GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          flyctl deploy --app cli-market-api --config fly.toml \
            --build-secret github_token="$BUILD_GH_TOKEN" --remote-only \
            --wait-timeout 600
