# Fly.io config — CLI Market API service
# Docs: https://fly.io/docs/reference/configuration/
#
# Deploy (build secret required — never pass the PAT as --build-arg,
# it gets persisted in plaintext in `fly config show`):
#   fly deploy --app cli-market-api --config fly.toml --build-secret github_token=$GITHUB_TOKEN

app = "cli-market-api"
primary_region = "gru"   # São Paulo — closest to PE/MX/CO/AR/CL

[build]
  dockerfile = "Dockerfile"

[env]
  MARKET_DATA_DIR = "/data"
  PORT = "8080"

  # Checkout price-freshness gate (pre_checkout_validate.py). Default was
  # 900s (15min), far tighter than the bulk collector's own refresh cadence
  # (COLLECT_INTERVAL_HOURS, default 4h) — under normal operation nearly
  # every checkout hit price_stale_or_drift regardless of client. Raised to
  # match that cadence with headroom (observed moat_age_hours ~1.8h in
  # practice). Was set at runtime via `fly secrets set` on 2026-08-11 to
  # avoid deploying this working tree's unrelated in-progress changes;
  # promoted here now that it's a deliberate, permanent config value.
  CHECKOUT_MAX_SNAPSHOT_AGE_SEC = "21600"

  # HORECA Pilot Configuration
  HORECA_ENABLED = "false"
  HORECA_FREE_SEARCHES_DAILY = "5"
  HORECA_COOLDOWN_HOURS = "4"
  HORECA_MAX_CONCURRENT_SEARCHES = "3"
  HORECA_PRIORITY_CATEGORIES = "aceites,limpieza,papel,bebidas,electrodomesticos"
  HORECA_SAVINGS_NOTIFICATION_THRESHOLD = "50.0"

  # Twilio Configuration (set via fly secrets)
  # TWILIO_ACCOUNT_SID
  # TWILIO_AUTH_TOKEN
  # TWILIO_WHATSAPP_NUMBER
  # WHATSAPP_ALLOWED_NUMBERS
  # WHATSAPP_ADMIN_NUMBERS
  # WHATSAPP_RATE_LIMIT_MIN = "20"
  # WHATSAPP_RATE_LIMIT_WINDOW = "60"
  # WHATSAPP_RATE_LIMIT_DAY = "300"

  # Telegram Configuration
  # TELEGRAM_BOT_TOKEN
  # TELEGRAM_WEBHOOK_SECRET
  # TELEGRAM_ALLOWED_CHAT_IDS
  # TELEGRAM_ADMIN_CHAT_IDS
  # TELEGRAM_PUBLIC_MODE = "false"  # solo tras aprobar apertura pública
  # TELEGRAM_RATE_LIMIT_MIN = "20"
  # TELEGRAM_RATE_LIMIT_WINDOW = "60"
  # TELEGRAM_RATE_LIMIT_DAY = "300"
  # TELEGRAM_GLOBAL_RATE_LIMIT_DAY = "1000"

  # API Keys
  # MARKET_API_TOKEN
  # MARKET_BOT_API_TOKEN
  # OPENAI_API_KEY

  # Claude's custom-connector UI has no header field for non-OAuth remote MCP
  # servers — it only takes a URL, so the API key can only be delivered as a
  # `?token=` query param. Re-enables the escape hatch that routers/mcp_http.py
  # disables by default (see CHANGELOG 2026-08-01 security hardening).
  MCP_ALLOW_QUERY_TOKEN = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false   # API debe estar siempre up
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 200
    soft_limit = 150

[[vm]]
  size = "shared-cpu-1x"
  # Bumped from 1024mb after the 2026-07-29 OOM: /dashboard/data's full-table
  # aggregation (price_snapshots ~150K+ rows and growing) tipped a 1GB machine
  # over during a cache-miss. See routers/dashboard.py for the accompanying
  # fetch-dedup + cross-machine compute lock fixes.
  memory = "2048mb"

[[restart]]
  policy = "always"
  max_retries = 10

[mounts]
  source = "cli_market_data"
  destination = "/data"

[[services.tcp_checks]]
  interval = "30s"
  timeout = "10s"
  grace_period = "60s"

[checks]
  [checks.health]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/health"
    port = 8080
    timeout = "5s"
    type = "http"
