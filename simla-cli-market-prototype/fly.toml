# fly.toml app configuration file generated for cli-market-simla on 2026-07-31T19:22:38-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'cli-market-simla'
primary_region = 'dfw'

[build]
[env]
  CLI_MARKET_API_URL = 'https://cli-market-api.fly.dev'
  LOG_LEVEL = 'INFO'
  SERVER_HOST = '0.0.0.0'
  SERVER_PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '15s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
