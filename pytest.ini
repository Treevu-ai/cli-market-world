[pytest]
markers =
    integration: live API tests against Fly.io (set MARKET_SKIP_LIVE=1 to skip latency)
# test_playwright_fallback.py is a standalone manual QA script (its own
# docstring: "Usage: python3 test_playwright_fallback.py"), not a pytest
# suite -- its async def test_* functions have no @pytest.mark.asyncio and
# it requires a real Playwright/Chromium install + live network, invoked
# via its own `if __name__ == "__main__"` runner. pytest's default rootdir
# collection picks it up anyway because the filename matches test_*.py,
# and every one of its 7 functions has always failed under pytest since it
# was added (never actually pytest-compatible). Excluded here rather than
# renamed so `python3 test_playwright_fallback.py` keeps working exactly
# as its own usage instructions describe.
# e2e_test.py is the same kind of standalone manual script -- it has no
# `def test_*` functions at all, it starts a real uvicorn server on a
# hardcoded port (8767) as top-level module code that runs on import alone,
# meant for `python3 e2e_test.py` invocation. pytest's default *_test.py
# collection pattern matches it, imports it (triggering the server start as
# a side effect), finds no collectable tests, and reports a collection
# ERROR -- and a second collection attempt in the same session fails the
# port bind outright since the first server thread is still alive (daemon
# thread, no clean shutdown).
addopts = --ignore=test_playwright_fallback.py --ignore=e2e_test.py
